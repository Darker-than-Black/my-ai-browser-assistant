<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h2>Gemini Assistant</h2>
    <div class="header-actions">
      <button id="context-btn" class="icon-btn active" title="Автоконтекст: читати текст сторінки">📄</button>
      <button id="eyes-btn" class="icon-btn" title="Очі: консоль + мережа + скриншот (увага: вмикає налагодження, жовтий банер на вкладці)">👁️</button>
      <button id="confirm-btn" class="icon-btn" title="Підтверджувати дії агента (клік/ввід/перехід) перед виконанням">✋</button>
      <button id="theme-btn" class="icon-btn" title="Тема: авто / темна / світла">🌓</button>
      <button id="clear-btn" class="icon-btn" title="Очистити чат">🗑️</button>
      <button id="settings-btn" class="icon-btn" title="Налаштування">⚙️</button>
    </div>
  </header>

  <!-- Settings view -->
  <section id="settings-view" class="hidden">
    <label class="field">
      <span>Gemini API ключ</span>
      <input id="api-key-input" type="password" placeholder="AIza..." autocomplete="off" />
      <small>Отримати ключ: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. Ключ зберігається локально у браузері.</small>
    </label>
    <label class="field">
      <span>Модель</span>
      <select id="model-select"></select>
    </label>
    <button id="save-settings-btn" class="primary">Зберегти</button>
    <p id="settings-status" class="status"></p>
  </section>

  <!-- Chat view -->
  <section id="chat-view">
    <div class="session-bar">
      <select id="session-select" title="Збережені чати"></select>
      <button id="new-session-btn" class="icon-btn" title="Новий чат">＋</button>
    </div>
    <div id="chat-log">
      <div class="msg gemini">Вітаю! Чим можу допомогти на цій сторінці?</div>
    </div>

    <div id="attachments"></div>

    <div class="input-container">
      <div class="input-row">
        <textarea id="user-input" rows="2" placeholder="Введіть запит або опишіть задачу... (Enter — надіслати, Shift+Enter — новий рядок)"></textarea>
      </div>
      <div class="input-controls">
        <button id="attach-btn" class="icon-btn" title="Додати зображення">🖼️</button>
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <button id="record-btn" class="icon-btn" title="Записати макрос (послідовність дій агента)">🎬</button>
        <select id="macro-select" class="model-quick" title="Макроси"></select>
        <button id="macro-play" class="icon-btn" title="Відтворити вибраний макрос">▶</button>
        <span id="context-badge" class="badge hidden">+ сторінка</span>
        <select id="model-quick" class="model-quick" title="Модель"></select>
        <button id="send-btn" class="primary">Надіслати</button>
      </div>
    </div>
  </section>

  <script src="markdown.js"></script>
  <script src="eyes.js"></script>
  <script src="tools.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
